<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Restablecer contraseña – Mil Cositas</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f7;
      color: #333;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    h1 { font-size: 1.4em; margin-bottom: 12px; }
    p { line-height: 1.6; color: #555; margin-bottom: 8px; }
    .icon { font-size: 48px; margin-bottom: 16px; }
    .error { color: #d32f2f; }
    .ok { color: #2e7d32; }
    input {
      width: 100%;
      padding: 12px 14px;
      margin-top: 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
    }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #1C1C1E;
      color: #fff;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: default; }
    .msg { font-size: 12px; color: #d32f2f; margin-top: 10px; min-height: 14px; }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="icon">🔒</div>
    <h1>Restablecer contraseña</h1>
    <p>Escribe tu nueva contraseña.</p>
    <form id="form">
      <input type="password" id="pass1" placeholder="Nueva contraseña" minlength="6" required />
      <input type="password" id="pass2" placeholder="Confirmar contraseña" minlength="6" required />
      <div class="msg" id="msg"></div>
      <button type="submit" id="btn">Guardar contraseña</button>
    </form>
  </div>

  <script>
    var SUPABASE_URL = 'https://mc-barber-api.62-238-60-24.sslip.io';
    var params = new URLSearchParams(window.location.search);
    var token = params.get('token');
    var card = document.getElementById('card');
    var form = document.getElementById('form');
    var msg = document.getElementById('msg');
    var btn = document.getElementById('btn');

    function render(icon, title, texto, cls) {
      card.innerHTML =
        '<div class="icon">' + icon + '</div>' +
        '<h1 class="' + cls + '">' + title + '</h1>' +
        '<p>' + texto + '</p>';
    }

    if (!token) {
      render('⚠️', 'Enlace inválido', 'No se encontró el token en el enlace.', 'error');
    } else {
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var p1 = document.getElementById('pass1').value;
        var p2 = document.getElementById('pass2').value;
        msg.textContent = '';

        if (p1.length < 6) {
          msg.textContent = 'Mínimo 6 caracteres.';
          return;
        }
        if (p1 !== p2) {
          msg.textContent = 'Las contraseñas no coinciden.';
          return;
        }

        btn.disabled = true;
        btn.textContent = 'Guardando…';

        fetch(SUPABASE_URL + '/functions/v1/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: token, new_password: p1 }),
        })
          .then(function (r) { return r.json(); })
          .then(function (data) {
            if (data.success) {
              render('✅', '¡Contraseña actualizada!', 'Ya puedes volver a la app de Mil Cositas e iniciar sesión con tu nueva contraseña.', 'ok');
            } else {
              var mensajes = {
                token_expired: 'Este enlace ya expiró. Solicita uno nuevo desde la app.',
                token_already_used: 'Este enlace ya fue usado.',
                invalid_token: 'El enlace no es válido.',
                weak_password: 'La contraseña debe tener al menos 6 caracteres.',
              };
              msg.textContent = mensajes[data.error] || 'Ocurrió un error. Intenta de nuevo.';
              btn.disabled = false;
              btn.textContent = 'Guardar contraseña';
            }
          })
          .catch(function () {
            msg.textContent = 'Error de conexión. Intenta más tarde.';
            btn.disabled = false;
            btn.textContent = 'Guardar contraseña';
          });
      });
    }
  </script>
</body>
</html>
