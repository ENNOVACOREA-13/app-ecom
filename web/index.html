<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PrettyCore">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PrettyCore">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PrettyCore</title>
  <link rel="manifest" href="manifest.json">
  <!-- Stripe.js -->
  <script src="https://js.stripe.com/v3/"></script>
  <script>
    // Cambia el favicon en runtime al logo del tenant actual (ver
    // favicon_updater.dart) — el <link> de arriba solo sirve como genérico
    // mientras se resuelve el tenant o si no tiene logo propio.
    window.setFavicon = function(url) {
      var link = document.querySelector("link[rel~='icon']");
      if (!link) {
        link = document.createElement('link');
        link.rel = 'icon';
        document.head.appendChild(link);
      }
      link.href = url;
    };

    // Inicializar Stripe con la clave publicable
    window._stripeInstance = null;
    window.initStripe = function(publishableKey) {
      window._stripeInstance = Stripe(publishableKey);
    };

    // Crear PaymentElement y montar en un div
    window._stripeElements = null;
    window._stripePaymentElement = null;

    window.stripeCreatePaymentElement = function(clientSecret, containerId) {
      return new Promise(function(resolve, reject) {
        try {
          window._stripeElements = window._stripeInstance.elements({
            clientSecret: clientSecret,
            appearance: { theme: 'stripe' }
          });
          window._stripePaymentElement = window._stripeElements.create('payment');
          window._stripePaymentElement.mount('#' + containerId);
          resolve(true);
        } catch(e) {
          reject(e.message);
        }
      });
    };

    window.stripeConfirmPayment = function(returnUrl) {
      return window._stripeInstance.confirmPayment({
        elements: window._stripeElements,
        confirmParams: { return_url: returnUrl },
        redirect: 'if_required'
      }).then(function(result) {
        if (result.error) {
          return { success: false, error: result.error.message };
        }
        return { success: true, paymentIntentId: result.paymentIntent.id };
      });
    };
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
